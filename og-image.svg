<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo -->
  <rect width="1200" height="630" fill="#0a0a14"/>
  <!-- Gradiente naranja sutil -->
  <radialGradient id="g" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#ff5c1a" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- Logo J -->
  <rect x="80" y="80" width="72" height="72" rx="16" fill="#ff5c1a"/>
  <text x="116" y="142" font-family="sans-serif" font-weight="900" font-size="52" fill="white" text-anchor="middle">J</text>
  <!-- Nombre -->
  <text x="172" y="132" font-family="sans-serif" font-weight="800" font-size="36" fill="white">JotaPrecios</text>
  <!-- Tagline -->
  <text x="80" y="280" font-family="sans-serif" font-weight="900" font-size="72" fill="white">Cobrá lo que</text>
  <text x="80" y="370" font-family="sans-serif" font-weight="900" font-size="72" fill="#ff5c1a">realmente vale</text>
  <text x="80" y="460" font-family="sans-serif" font-weight="900" font-size="72" fill="white">tu trabajo.</text>
  <!-- Tipos -->
  <text x="80" y="545" font-family="sans-serif" font-size="24" fill="#555">🖨️ 3D · 🎨 Sublimación · 🧵 Bordado · ✂️ Vinilo · ⚡ Láser · 📓 Papelería</text>
  <!-- Badge -->
  <rect x="900" y="80" width="220" height="44" rx="22" fill="#ff5c1a" fill-opacity="0.15" stroke="#ff5c1a" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1010" y="108" font-family="sans-serif" font-weight="700" font-size="18" fill="#ff8c5a" text-anchor="middle">🇦🇷 Para makers AR</text>
</svg>
